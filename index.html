<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pet Trade Evaluator</title>
  <style>
    body { font-family: sans-serif; background: #1e1e24; color: #fff; padding: 20px; }
    
    /* Scrollable Inventory Container */
    .inventory-container {
      max-height: 200px; /* Limits height so it won't fill up the screen */
      overflow-y: auto;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      background: #2b2b36;
      margin-bottom: 20px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 6px 10px;
      margin-bottom: 4px;
      background: #3a3a49;
      border-radius: 4px;
    }

    .trade-box {
      border: 1px solid #555;
      padding: 15px;
      border-radius: 8px;
      background: #252530;
    }

    .btn {
      background: #4F46E5;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: #4338CA; }
    
    .result { margin-top: 15px; padding: 10px; background: #1f2937; border-radius: 6px; }
  </style>
</head>
<body>

  <h2>🎒 My Inventory (Scrollable)</h2>
  <div class="inventory-container" id="inventory">
    <!-- Populated via JS -->
  </div>

  <div class="trade-box">
    <h2>🎯 Target Pet Evaluation</h2>
    <label>Pet Name: <input type="text" id="targetName" value="Frost Dragon"></label><br><br>
    <label>Base Value: <input type="number" id="targetValue" value="100"></label><br><br>
    
    <label>Demand: 
      <select id="targetDemand">
        <option value="high">High (+10% value)</option>
        <option value="medium" selected>Medium (Base value)</option>
        <option value="low">Low (-10% value)</option>
      </select>
    </label><br><br>

    <label>Trajectory: 
      <select id="targetTrajectory">
        <option value="rising" selected>Rising (+10% future overpay)</option>
        <option value="stable">Stable (0%)</option>
        <option value="dropping">Dropping (-15% underpay discount)</option>
      </select>
    </label><br><br>

    <button class="btn" onclick="evaluateTrade()">Suggest Best Offer</button>

    <div class="result" id="tradeOutput">Select options and click Suggest Best Offer.</div>
  </div>

  <script>
    // 1. Inventory Array
    const inventory = [
      { id: 1, name: "NFR Turtle", value: 32, demand: "High" },
      { id: 2, name: "NFR Turtle", value: 32, demand: "High" },
      { id: 3, name: "FR Cow", value: 15, demand: "High" },
      { id: 4, name: "FR SSBD", value: 14, demand: "High" },
      { id: 5, name: "FR Kangaroo", value: 11, demand: "Medium" },
      { id: 6, name: "FR Frost Fury", value: 7, demand: "Medium" },
      { id: 7, name: "NFR Dragon", value: 6, demand: "Low" },
      { id: 8, name: "Ride Potion", value: 1, demand: "High" },
      { id: 9, name: "Ride Potion", value: 1, demand: "High" },
      { id: 10, name: "Ride Potion", value: 1, demand: "High" },
      { id: 11, name: "Metal Ox", value: 0.5, demand: "Low" }
    ];

    // 2. Render Inventory into Scrollable Div
    function renderInventory() {
      const container = document.getElementById("inventory");
      container.innerHTML = "";
      inventory.forEach(item => {
        container.innerHTML += `
          <div class="item">
            <span><strong>${item.name}</strong> (${item.demand} Demand)</span>
            <span>Value: ${item.value}</span>
          </div>
        `;
      });
    }

    // 3. Trade Evaluation & Offer Suggestion Algorithm
    function evaluateTrade() {
      const baseVal = parseFloat(document.getElementById("targetValue").value);
      const demand = document.getElementById("targetDemand").value;
      const trajectory = document.getElementById("targetTrajectory").value;
      const petName = document.getElementById("targetName").value;

      // Adjust value based on Demand
      let demandMultiplier = 1.0;
      if (demand === "high") demandMultiplier = 1.10;
      if (demand === "low") demandMultiplier = 0.90;

      // Adjust value based on Trajectory (Future Growth)
      let trajectoryMultiplier = 1.0;
      if (trajectory === "rising") trajectoryMultiplier = 1.10;
      if (trajectory === "dropping") trajectoryMultiplier = 0.85;

      // Calculate Target True Value
      const adjustedTargetValue = baseVal * demandMultiplier * trajectoryMultiplier;

      // Greedy offer suggestion algorithm
      let offer = [];
      let currentOfferValue = 0;

      // Sort inventory by value descending to offer highest value items first
      const sortedInv = [...inventory].sort((a, b) => b.value - a.value);

      for (let item of sortedInv) {
        if (currentOfferValue < adjustedTargetValue) {
          offer.push(item);
          currentOfferValue += item.value;
        }
      }

      // Display Results
      const output = document.getElementById("tradeOutput");
      if (currentOfferValue < adjustedTargetValue) {
        output.innerHTML = `
          <p><strong>Target:</strong> ${petName}</p>
          <p><strong>Base Value:</strong> ${baseVal} | <strong>Adjusted Target Value:</strong> ${adjustedTargetValue.toFixed(1)}</p>
          <p style="color: #ef4444;">⚠️ Your full inventory total (${currentOfferValue}) is not enough to match the adjusted value of this target pet.</p>
        `;
      } else {
        const offerNames = offer.map(i => i.name).join(", ");
        output.innerHTML = `
          <p><strong>Target Pet:</strong> ${petName}</p>
          <p><strong>Base Target Value:</strong> ${baseVal}</p>
          <p><strong>Adjusted Target Value (Demand + Trajectory):</strong> <span style="color:#4ade80;">${adjustedTargetValue.toFixed(1)}</span></p>
          <hr style="border-color: #444;">
          <p><strong>Suggested Offer:</strong> ${offerNames}</p>
          <p><strong>Total Offer Value:</strong> ${currentOfferValue.toFixed(1)}</p>
          <p><strong>Verdict:</strong> ${currentOfferValue >= adjustedTargetValue ? "Fair / Solid Win Offer" : "Underpay"}</p>
        `;
      }
    }

    // Initialize UI on load
    renderInventory();
  </script>

</body>
</html>
