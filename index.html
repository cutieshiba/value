<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elvebredd Analytics - Adopt Me Value Tracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
            darkbg: '#0f172a',
            cardbg: '#1e293b'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white">

  <div class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- Top Header Navigation -->
    <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-8 border-b border-slate-800 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-white flex items-center gap-3">
          <i data-lucide="trending-up" class="text-brand-500 w-8 h-8"></i>
          Adopt Me Pet Value Analytics
        </h1>
        <p class="text-slate-400 text-sm mt-1">Real-time market trends & historical valuation data from Elvebredd</p>
      </div>
      <div id="statusBadge" class="self-start md:self-auto px-3 py-1.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-semibold flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        Loading CSV Data...
      </div>
    </header>

    <!-- Control Panel & Filters -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-8">
      
      <!-- Pet Selection Card -->
      <div class="lg:col-span-1 bg-cardbg p-5 rounded-xl border border-slate-800 shadow-xl space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Search Pet</label>
          <div class="relative">
            <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="Search pet name..." oninput="filterPetList()" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 transition">
          </div>
        </div>

        <!-- Variant & Potion Toggles -->
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Variant & Potions</label>
          <div class="grid grid-cols-4 gap-2 text-xs font-bold">
            <!-- Mega Toggle (Purple when active) -->
            <button id="toggle-M" onclick="toggleVariant('M')" 
                    class="py-2 rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition">
              M
            </button>
            <!-- Neon Toggle (Green when active) -->
            <button id="toggle-N" onclick="toggleVariant('N')" 
                    class="py-2 rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition">
              N
            </button>
            <!-- Fly Toggle (Blue when active) -->
            <button id="toggle-F" onclick="togglePotion('F')" 
                    class="py-2 rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition">
              F
            </button>
            <!-- Ride Toggle (Red when active) -->
            <button id="toggle-R" onclick="togglePotion('R')" 
                    class="py-2 rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition">
              R
            </button>
          </div>
          <div class="text-[11px] text-slate-500 mt-2 text-center">
            Current Selected Tag: <span id="activeComboTag" class="text-brand-500 font-semibold">Regular_NP</span>
          </div>
        </div>

        <!-- Pet List Selection -->
        <div>
          <select id="petSelect" onchange="onPetChange()" size="10" 
                  class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-brand-500 scrollbar-thin scrollbar-thumb-slate-700">
            <!-- Dynamically Populated -->
          </select>
        </div>
      </div>

      <!-- Main Analytics Viewport -->
      <div class="lg:col-span-3 space-y-6">
        
        <!-- Summary Stats Metrics -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
          <div class="bg-cardbg p-4 rounded-xl border border-slate-800">
            <span class="text-xs font-medium text-slate-400">Current Value</span>
            <div id="statCurrent" class="text-2xl font-bold text-white mt-1">--</div>
          </div>
          <div class="bg-cardbg p-4 rounded-xl border border-slate-800">
            <span class="text-xs font-medium text-slate-400">All-Time High</span>
            <div id="statATH" class="text-2xl font-bold text-emerald-400 mt-1">--</div>
          </div>
          <div class="bg-cardbg p-4 rounded-xl border border-slate-800">
            <span class="text-xs font-medium text-slate-400">Overall Change</span>
            <div id="statChange" class="text-2xl font-bold text-white mt-1">--</div>
          </div>
          <div class="bg-cardbg p-4 rounded-xl border border-slate-800">
            <span class="text-xs font-medium text-slate-400">Recorded Snapshots</span>
            <div id="statSnapshots" class="text-2xl font-bold text-brand-500 mt-1">--</div>
          </div>
        </div>

        <!-- Chart Card -->
        <div class="bg-cardbg p-6 rounded-xl border border-slate-800 shadow-xl space-y-4">
          <div>
            <h2 id="chartTitle" class="text-xl font-bold text-white">Select a Pet</h2>
            <p id="chartSubtitle" class="text-xs text-slate-400">Historical valuation line graph</p>
          </div>

          <!-- Chart Area -->
          <div class="relative h-[400px] w-full">
            <canvas id="valueChart"></canvas>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    let rawRecords = [];
    let uniqueBasePets = [];
    let chartInstance = null;

    // Filter Toggle States
    let activeType = 'Regular'; // 'Regular', 'N', 'M'
    let hasFly = false;
    let hasRide = false;

    // 1. Fetch & Parse CSV
    Papa.parse("history.csv", {
      download: true,
      skipEmptyLines: true,
      complete: function(results) {
        processCSVData(results.data);
        document.getElementById('statusBadge').className = "self-start md:self-auto px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold flex items-center gap-2";
        document.getElementById('statusBadge').innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> ${rawRecords.length} Records Loaded`;
      },
      error: function() {
        document.getElementById('statusBadge').className = "px-3 py-1.5 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 text-xs font-semibold";
        document.getElementById('statusBadge').innerText = "Failed to load history.csv";
      }
    });

    function processCSVData(rows) {
      if (!rows || rows.length === 0) return;

      let startIdx = 0;
      if (isNaN(parseFloat(rows[0][rows[0].length - 1]))) {
        startIdx = 1;
      }

      rawRecords = [];
      const basePetSet = new Set();

      for (let i = startIdx; i < rows.length; i++) {
        const row = rows[i];
        if (row.length >= 4) {
          const date = row[0].trim();
          const name = row.slice(1, row.length - 2).join(',').trim();
          const combo = row[row.length - 2].trim();
          const val = parseFloat(row[row.length - 1].trim());

          if (name && !isNaN(val)) {
            rawRecords.push({ date, name, combo, val });
            basePetSet.add(name);
          }
        }
      }

      uniqueBasePets = Array.from(basePetSet).sort();
      populatePetDropdown(uniqueBasePets);

      if (uniqueBasePets.length > 0) {
        document.getElementById('petSelect').value = uniqueBasePets[0];
        updateToggleUI();
        updateDashboard();
      }
      lucide.createIcons();
    }

    // 2. Populate Clean Base Pet List
    function populatePetDropdown(pets) {
      const select = document.getElementById("petSelect");
      select.innerHTML = "";
      pets.forEach(pet => {
        const opt = document.createElement("option");
        opt.value = pet;
        opt.textContent = pet;
        opt.className = "py-1 px-2 rounded hover:bg-slate-800 cursor-pointer text-xs";
        select.appendChild(opt);
      });
    }

    // 3. Search Filter
    function filterPetList() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = uniqueBasePets.filter(item => item.toLowerCase().includes(query));
      populatePetDropdown(filtered);
      if (filtered.length > 0) {
        document.getElementById("petSelect").value = filtered[0];
        updateDashboard();
      }
    }

    // 4. Toggle Handler Functions
    function toggleVariant(variant) {
      if (activeType === variant) {
        activeType = 'Regular'; // Unclicking turns back to Regular
      } else {
        activeType = variant;
      }
      updateToggleUI();
      updateDashboard();
    }

    function togglePotion(potion) {
      if (potion === 'F') hasFly = !hasFly;
      if (potion === 'R') hasRide = !hasRide;
      updateToggleUI();
      updateDashboard();
    }

    function getActiveComboTag() {
      let potionTag = "NP";
      if (hasFly && hasRide) potionTag = "FR";
      else if (hasFly) potionTag = "F";
      else if (hasRide) potionTag = "R";

      return `${activeType}_${potionTag}`;
    }

    function updateToggleUI() {
      const btnM = document.getElementById('toggle-M');
      const btnN = document.getElementById('toggle-N');
      const btnF = document.getElementById('toggle-F');
      const btnR = document.getElementById('toggle-R');

      // M = Purple when active
      btnM.className = activeType === 'M' 
        ? "py-2 rounded-lg bg-violet-600 text-white border border-violet-500 transition shadow" 
        : "py-2 rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition";

      // N = Green when active
      btnN.className = activeType === 'N' 
        ? "py-2 rounded-lg bg-emerald-600 text-white border border-emerald-500 transition shadow" 
        : "py-2 rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition";

      // F = Blue when active
      btnF.className = hasFly 
        ? "py-2 rounded-lg bg-brand-600 text-white border border-brand-500 transition shadow" 
        : "py-2 rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition";

      // R = Red when active
      btnR.className = hasRide 
        ? "py-2 rounded-lg bg-red-600 text-white border border-red-500 transition shadow" 
        : "py-2 rounded-lg bg-slate-800 text-slate-400 border border-slate-700 hover:border-slate-500 transition";

      document.getElementById('activeComboTag').innerText = getActiveComboTag();
    }

    function onPetChange() {
      updateDashboard();
    }

    // 5. Update Dashboard Chart & Metrics
    function updateDashboard() {
      const selectedPet = document.getElementById("petSelect").value;
      if (!selectedPet) return;

      const comboTag = getActiveComboTag();
      document.getElementById('chartTitle').innerText = `${selectedPet} (${comboTag})`;

      // Filter for exact pet & combo
      const records = rawRecords.filter(r => r.name === selectedPet && r.combo === comboTag);

      // Sort chronological dates
      records.sort((a, b) => new Date(a.date) - new Date(b.date));

      const dates = records.map(r => r.date);
      const values = records.map(r => r.val);

      // Summary Stats Calculation
      if (values.length > 0) {
        const currentVal = values[values.length - 1];
        const initialVal = values[0];
        const ath = Math.max(...values);
        const changePct = (((currentVal - initialVal) / initialVal) * 100).toFixed(1);

        document.getElementById('statCurrent').innerText = currentVal.toLocaleString();
        document.getElementById('statATH').innerText = ath.toLocaleString();
        document.getElementById('statSnapshots').innerText = records.length;

        const changeElem = document.getElementById('statChange');
        if (changePct > 0) {
          changeElem.className = "text-2xl font-bold text-emerald-400 mt-1";
          changeElem.innerText = `+${changePct}%`;
        } else if (changePct < 0) {
          changeElem.className = "text-2xl font-bold text-rose-400 mt-1";
          changeElem.innerText = `${changePct}%`;
        } else {
          changeElem.className = "text-2xl font-bold text-slate-300 mt-1";
          changeElem.innerText = `0.0%`;
        }
      } else {
        document.getElementById('statCurrent').innerText = "No Data";
        document.getElementById('statATH').innerText = "--";
        document.getElementById('statSnapshots').innerText = "0";
        document.getElementById('statChange').innerText = "--";
      }

      // Render Chart
      const ctx = document.getElementById('valueChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dates,
          datasets: [{
            label: 'Value',
            data: values,
            borderColor: '#6366f1',
            backgroundColor: '#6366f120',
            borderWidth: 2.5,
            pointRadius: 4,
            pointBackgroundColor: '#818cf8',
            fill: true,
            tension: 0.15
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#0f172a',
              titleColor: '#f8fafc',
              bodyColor: '#cbd5e1',
              borderColor: '#334155',
              borderWidth: 1,
              displayColors: false
            }
          },
          scales: {
            x: {
              grid: { color: '#1e293b' },
              ticks: { color: '#64748b' }
            },
            y: {
              grid: { color: '#1e293b' },
              ticks: { color: '#64748b' },
              beginAtZero: false
            }
          }
        }
      });
    }
  </script>
</body>
</html>
